<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube Music</title>
<style>
:root{color-scheme:dark;--red:#ff1744;--white:#f7f7f7}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050505;font-family:"Arial Narrow","Segoe UI",sans-serif}body{animation:appear .7s ease-out both}.splash{position:relative;width:100%;height:100%;isolation:isolate}.slides,.slide,.vignette,.scanlines,.noise{position:absolute;inset:0}.slide{background-position:center;background-size:cover;opacity:0;transform:scale(1.035);transition:opacity .18s ease-in-out}.slide.active{opacity:1}.vignette{background:radial-gradient(ellipse at 48% 42%,transparent 8%,rgba(0,0,0,.32) 56%,rgba(0,0,0,.88) 100%);z-index:1}.scanlines{z-index:2;opacity:.14;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.12) 4px,transparent 5px);animation:scan 7s linear infinite}.noise{z-index:3;opacity:.045;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E")}.top-line{position:absolute;z-index:5;top:0;left:0;width:100%;height:3px;background:var(--red);box-shadow:0 0 18px 3px var(--red);animation:pulse 1.6s ease-in-out infinite}.content{position:absolute;z-index:4;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:12px}.logo{position:relative;width:74px;height:74px;display:grid;place-items:center;margin-bottom:17px;border:1px solid rgba(255,255,255,.45);border-radius:22px 8px 22px 8px;background:rgba(8,8,8,.5);box-shadow:0 0 0 8px rgba(255,23,68,.08),0 0 34px rgba(255,23,68,.7),inset 0 0 20px rgba(255,23,68,.25);animation:float 3.2s ease-in-out infinite,pulse 2.2s ease-in-out infinite}.logo:before{content:"";width:27px;height:38px;border:7px solid var(--white);border-top-width:4px;border-radius:8px 8px 15px 15px;transform:rotate(-18deg);box-shadow:0 0 13px #ff4567}.logo:after{content:"";position:absolute;width:17px;height:17px;margin:22px 0 0 -24px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red)}h1{margin:0;color:var(--white);font-size:28px;font-weight:700;letter-spacing:1px;text-shadow:0 0 18px rgba(255,23,68,.9)}.tagline{margin-top:6px;color:rgba(255,255,255,.65);font-size:10px;font-weight:700;letter-spacing:5px;text-transform:uppercase}.badge{display:flex;align-items:center;gap:7px;margin-top:20px;padding:5px 10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.46);color:rgba(255,255,255,.72);font-size:9px;letter-spacing:1.5px;text-transform:uppercase}.badge i{width:5px;height:5px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:blink 1s steps(2) infinite}.corners{position:absolute;z-index:5;inset:21px;pointer-events:none}.corner{position:absolute;width:25px;height:25px;border-color:var(--red);border-style:solid;opacity:.85}.tl{top:0;left:0;border-width:1px 0 0 1px}.tr{top:0;right:0;border-width:1px 1px 0 0}.bl{bottom:0;left:0;border-width:0 0 1px 1px}.br{right:0;bottom:0;border-width:0 1px 1px 0}.footer{position:absolute;z-index:6;right:28px;bottom:22px;left:28px}.loading-label{margin-bottom:8px;color:rgba(255,255,255,.72);font-family:monospace;font-size:10px;letter-spacing:2px}.loading-label span{display:inline-block;width:18px;overflow:hidden;vertical-align:bottom}.progress{height:3px;overflow:hidden;background:rgba(255,255,255,.2)}.progress-bar{position:relative;width:0;height:100%;background:var(--red);box-shadow:0 0 10px var(--red)}.progress-bar:after{content:"";position:absolute;inset:0;width:80px;background:linear-gradient(90deg,transparent,#fff,transparent);animation:shimmer 1.1s linear infinite}.fade-out{animation:fade-out .32s ease-in forwards}@keyframes appear{from{opacity:0}to{opacity:1}}@keyframes fade-out{to{opacity:0}}@keyframes pulse{50%{opacity:.62}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes blink{50%{opacity:.25}}@keyframes scan{to{transform:translateY(5px)}}@keyframes shimmer{from{transform:translateX(-90px)}to{transform:translateX(700px)}}
</style>
<style>
.content{justify-content:flex-start;padding-top:34px}
.content h1,.content .tagline,.content .badge,.loading-label{display:none}
.logo{position:relative;width:48px;height:48px;margin:0;border:1px solid rgba(255,255,255,.45);border-radius:14px;background:rgba(8,8,8,.52) url('./icon.ico') center/contain no-repeat;background-origin:content-box;padding:7px;box-shadow:0 0 0 6px rgba(255,23,68,.08),0 0 28px rgba(255,23,68,.7);animation:float 3.2s ease-in-out infinite,pulse 2.2s ease-in-out infinite}
.logo:before,.logo:after{display:none}
.splash{overflow:hidden;border-radius:16px}
.footer{right:0;bottom:0;left:0}
.progress{height:3px}
</style>
</head>
<body>
<main class="splash"><div class="slides" aria-hidden="true"></div><div class="vignette"></div><div class="scanlines"></div><div class="noise"></div><div class="top-line"></div><div class="corners"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div><section class="content"><div class="logo" aria-hidden="true"></div><h1>YouTube Music</h1><div class="tagline">Desktop App</div><div class="badge"><i></i> Version 3.12.0</div></section><footer class="footer"><div class="loading-label">Loading<span>...</span></div><div class="progress"><div class="progress-bar"></div></div></footer></main>
<script>
const slideHost=document.querySelector('.slides'),progress=document.querySelector('.progress-bar'),loadingDots=document.querySelector('.loading-label span'),startedAt=performance.now();
const slides=Array.from({length:5},(_,index)=>{const slide=document.createElement('div');slide.className='slide'+(index===0?' active':'');slide.style.backgroundImage=`url('./Splash%20Loading/LoadingYTM${index+1}.jpg')`;slideHost.appendChild(slide);return slide});let active=0;
setInterval(()=>{slides[active].classList.remove('active');active=(active+1)%slides.length;slides[active].classList.add('active')},250);
setInterval(()=>{loadingDots.textContent='.'.repeat((loadingDots.textContent.length%3)+1)},500);
const tick=now=>{progress.style.width=`${Math.min(100,((now-startedAt)/3000)*100)}%`;if(now-startedAt<3000)requestAnimationFrame(tick)};requestAnimationFrame(tick);
window.splash?.onClose(()=>document.body.classList.add('fade-out'));
</script>
</body>
</html>
